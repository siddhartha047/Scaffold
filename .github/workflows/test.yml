name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Spot-check the other platforms on one interpreter rather than
          # multiplying the whole matrix by three.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=scaffold --cov-report=term-missing

  # The kernels have a pure-Python fallback for environments without numba.
  # It is easy to break it with a NumPy idiom numba cannot compile, or vice
  # versa, so it gets its own job rather than being assumed to work.
  no-numba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install without numba
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[networkx,viz]" pytest
      - name: Confirm numba is absent
        run: |
          python -c "
          from scaffold.kernels import HAVE_NUMBA
          assert not HAVE_NUMBA, 'numba should not be installed in this job'
          print('running the pure-Python kernel path')
          "
      - run: pytest

  # Likewise the minimal install: numpy and scipy only, no networkx, no torch,
  # no matplotlib. Catches an optional import that leaked to module scope.
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - run: |
          python -c "
          import scaffold
          r = scaffold.fast(scaffold.grid_graph(20, 20), keep_ratio=0.6)
          print(r.summary())
          assert r.num_components() == 1
          "
      - run: pytest

  pyg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with PyTorch Geometric
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[pyg,networkx]" pytest
      - run: pytest tests/test_adapters.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "
          import scaffold
          print(scaffold.__version__)
          print(scaffold.fast(scaffold.grid_graph(12, 12), keep_ratio=0.7).summary())
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
